name: Publish catalog snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-snapshot-${{ github.sha }}
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run validate:publish
      - name: Build fixed production snapshot
        run: npm run build -- --output dist/collections --source-revision "$GITHUB_SHA"
      - name: Record manifest checksum
        id: manifest
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, appendFile } from 'node:fs/promises';
          const bytes = await readFile('dist/collections/manifest.json');
          const manifest = JSON.parse(bytes);
          if (manifest.preview || manifest.sourceRevision !== process.env.GITHUB_SHA) {
            throw new Error('Snapshot must be production and match this commit');
          }
          const hash = createHash('sha256').update(bytes).digest('hex');
          await appendFile(process.env.GITHUB_OUTPUT, `sha256=${hash}\n`);
          await appendFile(process.env.GITHUB_STEP_SUMMARY,
            `Production snapshot: ${manifest.sourceRevision}. Pending collections are excluded; this may contain zero approved collections.\n`);
          NODE
      - name: Archive snapshot without a wrapping directory
        run: zip -q -r ../../catalog.zip .
        working-directory: dist/collections
      - name: Checksum archive
        run: sha256sum catalog.zip > catalog.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ github.sha }}
          path: |
            catalog.zip
            catalog.zip.sha256
          if-no-files-found: error
      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="snapshot-$GITHUB_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Snapshot release already exists; refusing to overwrite its assets.'
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo 'Snapshot tag already exists; refusing to reuse an unchecked tag.'
            exit 1
          fi
          gh release create "$tag" catalog.zip catalog.zip.sha256 \
            --target "$GITHUB_SHA" --title "$tag" \
            --notes 'Production collection snapshot. Pending collections are excluded. Installation and workflow results are recorded separately in each collection.'

  notify-site:
    needs: snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Notify configured website connection
        env:
          NOTIFICATION_MODE: ${{ vars.SITE_NOTIFICATION_MODE }}
          SITE_REPOSITORY: ${{ vars.SITE_REPOSITORY }}
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          MANIFEST_SHA256: ${{ needs.snapshot.outputs.manifest_sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';
          const mode = process.env.NOTIFICATION_MODE || 'disabled';
          const summary = (text) => appendFile(process.env.GITHUB_STEP_SUMMARY, `${text}\n`);
          if (mode === 'disabled') {
            await summary('Website notification: disabled. No website synchronization was requested.');
            process.exit(0);
          }
          try {
            let endpoint;
            let options;
            if (mode === 'repository_dispatch') {
              if (!/^[A-Za-z0-9][A-Za-z0-9-]*\/[A-Za-z0-9_.-]+$/.test(process.env.SITE_REPOSITORY || '') || !process.env.SITE_DISPATCH_TOKEN) {
                throw new Error('missing configuration');
              }
              endpoint = `https://api.github.com/repos/${process.env.SITE_REPOSITORY}/dispatches`;
              options = { method: 'POST', headers: {
                Authorization: `Bearer ${process.env.SITE_DISPATCH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
              }, body: JSON.stringify({ event_type: 'catalog_snapshot', client_payload: {
                repository: process.env.GITHUB_REPOSITORY,
                sourceRevision: process.env.GITHUB_SHA,
                releaseTag: `snapshot-${process.env.GITHUB_SHA}`,
                manifestSha256: process.env.MANIFEST_SHA256,
              } }) };
            } else if (mode === 'cloudflare_hook') {
              const hook = new URL(process.env.CLOUDFLARE_DEPLOY_HOOK || '');
              if (hook.protocol !== 'https:' || hook.hostname !== 'api.cloudflare.com' || hook.username || hook.password || !hook.pathname.startsWith('/client/v4/pages/webhooks/deploy_hooks/')) {
                throw new Error('invalid configuration');
              }
              endpoint = hook;
              options = { method: 'POST' };
            } else {
              throw new Error('unsupported mode');
            }
            const response = await fetch(endpoint, { ...options, redirect: 'error', signal: AbortSignal.timeout(30000) });
            if (!response.ok) throw new Error('request failed');
            await summary('Website trigger accepted. Website deployment and deployed data revision still require verification.');
          } catch {
            await summary('Website notification failed: configuration or request error. Website synchronization is unverified.');
            console.error('Website notification failed. Check configuration without printing secrets.');
            process.exit(1);
          }
          NODE
