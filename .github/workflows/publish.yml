name: Publish catalog data
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-data-publication
  cancel-in-progress: false
jobs:
  reindex:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/compact-collection-search'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: proposal
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 25115bdbb23ce21a53a34e3b7d68ca5a4bd90154
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: proposal/package-lock.json
      - run: npm ci
        working-directory: proposal
      - run: ln -s "$GITHUB_WORKSPACE/proposal/node_modules" "$GITHUB_WORKSPACE/baseline/node_modules"
      - run: node .github/scripts/reindex-once.mjs
        working-directory: proposal
        env:
          BASELINE_DIR: ../baseline
          CATALOG_DATA_BASE_URL: ${{ vars.CATALOG_DATA_BASE_URL }}
      - run: npm run deploy:data -- --dry-run
        working-directory: proposal
      - run: npm run deploy:data
        working-directory: proposal
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npm run test:data -- --url "$CATALOG_DATA_BASE_URL"
        working-directory: proposal
        env:
          CATALOG_DATA_BASE_URL: ${{ vars.CATALOG_DATA_BASE_URL }}
