name: Suggest a collection
description: Share real sources and use cases for a collection.
title: "[Collection] "
body:
  - type: textarea
    id: task
    attributes:
      label: Task and use cases
      description: Explain the task these Skills address and why you selected this combination.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Public sources
      description: Link repositories, Skill directories, public recommendations, and author information. Mark unknown details clearly.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verified and open items
      description: Describe versions, licenses, resource scope, and any actual testing. Do not mark untested items as passed.
  - type: textarea
    id: cover
    attributes:
      label: Optional cover
      description: Attach an image with its source and usage rights. Maintainers archive accepted images.
